# ==========================================
# ข้อมูลพื้นฐานของโปรเจกต์
# ==========================================

# ชื่อ Package ภายใน Flutter
# ไม่ควรเปลี่ยนชื่อนี้หากยังมีไฟล์ Import ที่อ้างอิงชื่อเดิม
name: social_app

# คำอธิบายแอปพลิเคชัน
description: "Oxny - Connect, Share, Be Together"

# ป้องกันการเผยแพร่ Package ไปยัง pub.dev โดยไม่ตั้งใจ
publish_to: "none"

# เวอร์ชันของแอป
# 1.0.0 = Version Name
# +1 = Build Number
version: 1.0.0+1

# ==========================================
# เวอร์ชัน Dart SDK ที่รองรับ
# ==========================================

environment:
  sdk: ^3.12.2

# ==========================================
# Dependencies (แพ็กเกจที่ใช้ในโปรเจกต์)
# ==========================================

dependencies:
  # Flutter Framework หลัก
  flutter:
    sdk: flutter

  # ไอคอนรูปแบบ Cupertino สำหรับตกแต่ง UI
  cupertino_icons: ^1.0.8

  # เชื่อมต่อและเริ่มต้นใช้งาน Firebase
  firebase_core: ^4.15.0

  # ระบบสมัครสมาชิก เข้าสู่ระบบ และยืนยันตัวตน
  firebase_auth: ^6.7.0

  # ฐานข้อมูล Cloud Firestore
  cloud_firestore: ^6.10.0

  # จัดการ State และส่งข้อมูลระหว่าง Widget
  provider: ^6.1.5+1

  # เลือกภาพและวิดีโอจากอุปกรณ์
  image_picker: ^1.2.4

  # ส่ง HTTP Request ไปยัง API และบริการภายนอก
  http: ^1.6.0

  # เล่นไฟล์วิดีโอภายในแอป
  video_player: ^2.14.1

  # จัดเก็บข้อมูลขนาดเล็กภายในอุปกรณ์
  shared_preferences: ^2.5.6

# ==========================================
# Dev Dependencies (แพ็กเกจสำหรับพัฒนา)
# ==========================================

dev_dependencies:
  # เครื่องมือสำหรับทดสอบ Flutter
  flutter_test:
    sdk: flutter

  # ตรวจสอบคุณภาพและรูปแบบโค้ด Dart
  flutter_lints: ^6.0.0

  # สร้างไอคอนแอปสำหรับ Android และ iOS
  flutter_launcher_icons: any

  # สร้างหน้า Splash Screen ตอนเปิดแอป
  flutter_native_splash: any

# ==========================================
# การตั้งค่าหลักของ Flutter
# ==========================================

flutter:
  # เปิดใช้งาน Material Icons
  uses-material-design: true

  # กำหนดไฟล์รูปภาพที่ต้องการนำมาใช้ในแอป
  assets:
    # ไอคอนหลักของแอป Oxny
    - assets/icon/icon.png

    # รูปไอคอนสำหรับ Android Adaptive Icon
    - assets/icon/icon_foreground.png

    # ภาพปก Splash Screen
    - assets/splash/cover.png

    # โลโก้ที่ใช้แสดงตอนเปิดแอป
    - assets/splash/splash_logo.png

# ==========================================
# APP ICON SETTINGS
# ตั้งค่าไอคอนของแอป Oxny
# ==========================================

flutter_launcher_icons:
  # สร้างไอคอนสำหรับ Android
  android: true

  # สร้างไอคอนสำหรับ iOS
  ios: true

  # ตำแหน่งไฟล์รูปไอคอนหลัก
  image_path: "assets/icon/icon.png"

  # สีพื้นหลังของ Android Adaptive Icon
  adaptive_icon_background: "#5B5FEF"

  # ตำแหน่งไฟล์รูปด้านหน้าของ Adaptive Icon
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

  # ลบพื้นที่โปร่งใสส่วนเกินสำหรับไอคอน iOS
  remove_alpha_ios: true

# ==========================================
# SPLASH SCREEN SETTINGS
# ตั้งค่าหน้าจอขณะเปิดแอป Oxny
# ==========================================

flutter_native_splash:
  # สีพื้นหลังของหน้า Splash Screen
  color: "#5B5FEF"

  # รูปโลโก้ที่แสดงตรงกลางหน้าจอ
  image: "assets/splash/splash_logo.png"

  # เปิดใช้งาน Splash Screen สำหรับ Android
  android: true

  # เปิดใช้งาน Splash Screen สำหรับ iOS
  ios: true

  # ปิด Splash Screen สำหรับ Web
  web: false

  # ========================================
  # Android 12 และเวอร์ชันที่ใหม่กว่า
  # ========================================

  android_12:
    # สีพื้นหลังของ Splash Screen บน Android 12+
    color: "#5B5FEF"

    # โลโก้ที่แสดงบน Splash Screen Android 12+
    image: "assets/splash/splash_logo.png"
